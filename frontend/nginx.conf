server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing : toutes les routes renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck pour K8S
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}